<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poly Markets 模拟交易演示</title>
<style>
*{box-sizing:border-box}body{margin:0;font:18px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif;background:#f5f7fb;color:#111}
.banner{position:sticky;top:0;z-index:9;background:#b45309;color:#fff;text-align:center;padding:6px 8px;font-weight:700;font-size:13px;line-height:1.35}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}h1{font-size:22px;margin:0}
main{max-width:640px;margin:0 auto;padding:0 12px 60px}section{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0001}
h2{font-size:20px;margin:0 0 10px}button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#2563eb;color:#fff;cursor:pointer}
button.alt{background:#e5e7eb;color:#111}button.green{background:#16a34a}input,textarea{font:inherit;width:100%;padding:12px;border:2px solid #cbd5e1;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.big{font-size:40px;font-weight:800;text-align:center}.muted{color:#64748b;font-size:15px}
.tag{display:inline-block;background:#fef3c7;color:#92400e;border-radius:6px;padding:0 6px;font-size:13px;font-weight:700}
.card{border:2px solid #2563eb;border-radius:12px;padding:12px;margin-top:10px}.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.check{font-size:64px;color:#16a34a;text-align:center}.err{color:#dc2626}details summary{cursor:pointer;font-weight:700}
#tour{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.tbox{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
.chips button{background:#eef2ff;color:#1e3a8a;font-size:15px;padding:8px 10px;margin:4px 4px 0 0}
</style></head><body>
<div class="banner" id="banner"></div>
<header><h1>Poly Markets</h1><button class="alt" id="lang">English</button></header>
<main>
<section id="bal"></section>
<section id="deposit"></section>
<section id="intent"></section>
<section id="markets"></section>
<section><details id="radar"><summary></summary><div id="radarBody"></div></details></section>
<section id="portfolio"></section>
<section><details id="fees"><summary></summary><div id="feesBody"></div></details></section>
</main>
<script src="core.js"></script><script src="app.js"></script>
</body></html>
